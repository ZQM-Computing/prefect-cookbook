name: Validate Prefect dlt example

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prefect-dlt-example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Runtime-test synthetic dlt flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install bounded test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Record exact runtime versions
        run: |
          python - <<'PY'
          import duckdb
          import dlt
          import prefect
          print(f"Python runtime is supplied by the runner: 3.11")
          print(f"Prefect: {prefect.__version__}")
          print(f"dlt: {dlt.__version__}")
          print(f"DuckDB: {duckdb.__version__}")
          PY
      - name: Test destination row count and replace behavior
        run: python -m pytest -q
